name: ems_protocols
description: EMS protocol reference app using native text only.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  translator: ^1.0.4+1
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/baxter_wordmark.png
    - assets/baxter_mark.png
